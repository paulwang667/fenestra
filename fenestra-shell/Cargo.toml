[package]
name = "fenestra-shell"
description = "Windowed (winit + wgpu) and headless runners for the fenestra GUI framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Android: which activity the app is packaged with. winit exposes the
# `AndroidApp` the event loop binds to (see `WindowOptions::with_android_app`)
# only behind one of these, and they are mutually exclusive — pick
# `android-game-activity` with `default-features = false`. GameActivity is
# the one with an `InputConnection`, so IME text (pinyin, accents) arrives.
#
# `android-game-activity` needs a winit with GameActivity IME support
# (`Ime::TextState`), not yet in a release. An app using it adds, in its own
# root `Cargo.toml` (a patch here would only reach this workspace):
#
#     [patch.crates-io]
#     winit = { git = "https://github.com/paulwang667/winit", rev = "18d09344b46c772fdd2b8b3ba318ee7ae58a06ea" }
#
# That is 0.30.13 plus the IME delivery. Neither the default activity nor
# any other target needs it.
[features]
default = ["android-native-activity"]
android-native-activity = ["winit/android-native-activity"]
android-game-activity = ["winit/android-game-activity"]
# iOS text input through the winit fork (`paulwang667/winit`, branch
# `fenestra/v0.30.13-ios-text-input`): input-method composing (Chinese,
# Japanese), keyboard traits, the keyboard in the safe area. Needs that winit
# patched in; without the feature iOS types through `KeyboardInput` only.
ios-text-input = []

[dependencies]
fenestra-core.workspace = true
fenestra-raster.workspace = true
winit.workspace = true
kurbo.workspace = true
wgpu.workspace = true
vello.workspace = true

# Native-only: headless rendering/readback, OS clipboard, AccessKit.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit.workspace = true
serde.workspace = true
serde_json.workspace = true
accesskit_winit.workspace = true
image.workspace = true
pollster.workspace = true

# The clipboard bridge has no Android backend (arboard supports X11/
# Wayland, macOS, and Windows), so it stays out of Android builds.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
arboard.workspace = true

# The native menu bar attaches on macOS (muda's safe path; see
# ARCHITECTURE.md for the Windows/Linux story).
[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

# Web-only: async surface setup and a clock that works without std::time.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
web-time.workspace = true
web-sys.workspace = true

