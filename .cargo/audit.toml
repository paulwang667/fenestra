# cargo-audit config (auto-discovered from the working directory).
# Run: cargo audit   (CI runs it on every push + weekly)
#
# Kept in lockstep with deny.toml's [advisories] ignore list — see
# ARCHITECTURE.md ("cargo-audit/cargo-deny: unfixable transitive
# advisories") for the dependency chains and revisit triggers.

[advisories]
# RUSTSEC-2024-0429 (glib) is assessed 2026-08-10 and deliberately left OUT
# of this list so it keeps printing: unsoundness, not a vulnerability, and
# unreachable on every supported target. RUSTSEC-2026-0221 (event-listener)
# is absent for a different reason — it is *fixed*, by pinning 5.4.2 in the
# lockfile; it does reach Linux. See deny.toml for both, in full; the two
# files stay in lockstep.
ignore = [
  "RUSTSEC-2026-0194", # quick-xml: quadratic run time on duplicate attrs
  "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-decl allocation
  "RUSTSEC-2026-0192", # ttf-parser: unmaintained
  # gtk3-rs bindings via muda's Linux half — never compiled for any
  # supported target (muda is macOS-only here); see ARCHITECTURE.md.
  "RUSTSEC-2024-0412", # gdk: gtk3-rs unmaintained
  "RUSTSEC-2024-0413", # atk: gtk3-rs unmaintained
  "RUSTSEC-2024-0415", # gtk: gtk3-rs unmaintained
  "RUSTSEC-2024-0416", # atk-sys: gtk3-rs unmaintained
  "RUSTSEC-2024-0418", # gdk-sys: gtk3-rs unmaintained
  "RUSTSEC-2024-0419", # gtk3-macros: gtk3-rs unmaintained
  "RUSTSEC-2024-0420", # gtk-sys: gtk3-rs unmaintained
  "RUSTSEC-2024-0370", # proc-macro-error: unmaintained, only via gtk3-macros/muda
]
