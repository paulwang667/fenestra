[package]
name = "fenestra-a2ui"
description = "A native Rust renderer for A2UI (Agent-to-UI) v0.9: agents send declarative JSON surfaces, fenestra renders them — verifiable headlessly."
# Inherited, not restated: this crate ships in the workspace release train, and
# a hand-copied version here silently drifts from the one the workspace
# dependency table advertises.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
fenestra-core.workspace = true
fenestra-kit.workspace = true
fenestra-markdown.workspace = true
# The basic catalog's `regex` check function and TextField's
# `validationRegexp`. Rust's engine has no backreferences or lookaround, so a
# pattern written for a browser client can be valid and still not compile
# here — that case records a note rather than quietly passing the check.
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
fenestra-shell.workspace = true
