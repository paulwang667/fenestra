# cargo-deny: advisories, licenses, bans, sources.
# Run: cargo deny check   (CI runs it on every push + weekly)

[advisories]
yanked = "deny"
# RUSTSEC-2024-0429 (glib 0.18.5, unsoundness in `VariantStrIter`) is
# assessed 2026-08-10 and deliberately NOT ignored, so it stays visible in
# every run. It is unsoundness rather than a vulnerability, and it arrives
# through muda's Linux half, which is never compiled for a supported target
# (see the gtk3 note below). Listing it here would only hide it; this comment
# records that it was read, not missed.
#
# RUSTSEC-2026-0221 (event-listener, `!Send` tags crossing a thread boundary
# via `StackSlot`) was briefly filed under the same reasoning, and that was
# wrong: `cargo tree -i event-listener --target x86_64-unknown-linux-gnu`
# runs fenestra-shell -> accesskit_winit -> accesskit_unix -> zbus ->
# async-broadcast -> event-listener, so it compiles and runs on Linux, which
# CI tests. It is fixed rather than justified — the lockfile pins 5.4.2, the
# patched release. The lesson is the one this file exists to prevent: an
# advisory inherits nothing from the advisory listed next to it, and
# "transitive" is not a synonym for "unreachable".
# Transitive-only, no upstream fix available as of 2026-07-02 — see
# ARCHITECTURE.md ("cargo-audit/cargo-deny: unfixable transitive advisories")
# for the dependency chains and revisit trigger. Re-run `cargo tree -i
# <crate>` before removing any entry to confirm a fix has actually shipped.
ignore = [
  # quick-xml 0.39.4, via winit's Wayland backend -> smithay-client-toolkit
  # -> wayland-scanner (pinned to `quick-xml = "^0.39"`) and via zbus_xml's
  # AT-SPI stack. `cargo update -p quick-xml --precise 0.41.0` fails to
  # resolve: no wayland-scanner release exists yet that allows quick-xml
  # >=0.41. Revisit when wayland-scanner or zbus_xml bumps its requirement.
  "RUSTSEC-2026-0194", # quick-xml: quadratic run time on duplicate attrs
  "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-decl allocation
  # ttf-parser 0.25.1 (unmaintained), via winit's Wayland Adwaita
  # decorations -> sctk-adwaita -> ab_glyph -> owned_ttf_parser. Neither
  # ab_glyph nor sctk-adwaita has published since 2025-09; no successor
  # crate to move to yet. Revisit when either releases again.
  "RUSTSEC-2026-0192", # ttf-parser: unmaintained
  # The archived gtk3-rs bindings, via muda's *Linux* half. muda is a
  # macOS-only dependency of fenestra-shell (Linux menu bars are a GTK
  # concept fenestra deliberately does not build on — ARCHITECTURE.md,
  # "Declarative native menus"), so none of these crates is ever compiled
  # for any supported target: `cargo tree -i gtk --target
  # x86_64-unknown-linux-gnu` prints nothing. They appear here only
  # because cargo-deny's graph keeps every cfg-gated edge of every
  # resolved crate. Revisit when muda moves its Linux backend off gtk3
  # (upstream is tracking gtk4) or grows a feature to opt out of it.
  "RUSTSEC-2024-0412", # gdk: gtk3-rs unmaintained
  "RUSTSEC-2024-0413", # atk: gtk3-rs unmaintained
  "RUSTSEC-2024-0415", # gtk: gtk3-rs unmaintained
  "RUSTSEC-2024-0416", # atk-sys: gtk3-rs unmaintained
  "RUSTSEC-2024-0418", # gdk-sys: gtk3-rs unmaintained
  "RUSTSEC-2024-0419", # gtk3-macros: gtk3-rs unmaintained
  "RUSTSEC-2024-0420", # gtk-sys: gtk3-rs unmaintained
  "RUSTSEC-2024-0370", # proc-macro-error: unmaintained, only via gtk3-macros/muda
]

[licenses]
# The workspace itself is MIT OR Apache-2.0. Everything in the tree
# must resolve to one of these well-understood licenses.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  # Boost Software License (the permissive OSI one, not BUSL).
  "BSL-1.0",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
